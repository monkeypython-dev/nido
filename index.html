<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f8">
  <meta name="description" content="Gimnasio, calorías y una mascota que crece con vosotros.">
  <title>Nido</title>
  <script>
    // Aplicar el tema antes de pintar para evitar parpadeo
    (function () {
      var t = 'auto';
      try { t = localStorage.getItem('nido-theme') || 'auto'; } catch (e) {}
      if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preload" href="fonts/jakarta-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="user-pill" data-action="switch-user" aria-label="Cambiar de persona"></button>
      <div class="top-right">
        <span class="sync-badge" title="Sincronización"></span>
        <button class="icon-btn" data-action="open-settings" aria-label="Ajustes"></button>
      </div>
    </header>
    <main id="view"></main>
    <nav class="tabbar">
      <button data-tab="pet"><span class="tab-ic" data-ic="egg"></span>Inicio</button>
      <button data-tab="train"><span class="tab-ic" data-ic="dumbbell"></span>Entrenar</button>
      <button data-tab="food"><span class="tab-ic" data-ic="utensils"></span>Nutrición</button>
      <button data-tab="progress"><span class="tab-ic" data-ic="chart-line"></span>Progreso</button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
