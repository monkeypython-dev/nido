<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7ec">
  <meta name="description" content="Gimnasio, calorías y una mascota que crece con vosotros.">
  <title>Nido</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="user-pill" data-action="switch-user" aria-label="Cambiar de persona">
        <span class="user-dot"></span><span class="user-name"></span><span class="chev">⇄</span>
      </button>
      <div class="brand">Nido</div>
      <div class="top-right">
        <span class="sync-dot" title="Sincronización"></span>
        <button class="icon-btn" data-action="open-settings" aria-label="Ajustes">⚙️</button>
      </div>
    </header>
    <main id="view"></main>
    <nav class="tabbar">
      <button data-tab="pet"><span>🥚</span>Mascota</button>
      <button data-tab="train"><span>🏋️</span>Entrenar</button>
      <button data-tab="food"><span>🍽️</span>Comida</button>
      <button data-tab="progress"><span>📈</span>Progreso</button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
